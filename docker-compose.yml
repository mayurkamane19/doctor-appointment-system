services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hospital
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: change-me-before-production
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgresql://hospital:change-me-before-production@db:5432/hospital
      DJANGO_SECRET_KEY: change-me-before-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports: ["8000:8000"]
    depends_on: [db]
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
volumes:
  postgres_data:
